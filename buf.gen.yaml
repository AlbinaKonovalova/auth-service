version: v1

plugins:
  - name: go
    out: pkg
    opt: paths=source_relative
    path: bin/protoc-gen-go
    strategy: directory

  - name: go-grpc
    out: pkg
    opt: paths=source_relative
    path: bin/protoc-gen-go-grpc
    strategy: directory

  - name: grpc-gateway
    out: pkg
    opt:
      - paths=source_relative
      - generate_unbound_methods=true
    path: bin/protoc-gen-grpc-gateway
    strategy: directory

  - name: openapiv2
    out: pkg/authservice/v1
    opt:
      - allow_merge=true
      - merge_file_name=authservice
    path: bin/protoc-gen-openapiv2
    strategy: all