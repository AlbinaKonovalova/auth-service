syntax = "proto3";

package authservice.v1;

option go_package = "github.com/AlbinaKonovalova/auth-service/pkg/authservice/v1;authservicev1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Auth Service API"
    version: "1.0"
    description: "Authentication and authorization service for admin platform"
  }
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT access token. Format: Bearer {token}"
      }
    }
  }
  consumes: "application/json"
  produces: "application/json"
};

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login"
      description: "Authenticate user by email and password"
      tags: ["auth"]
    };
  }

  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Refresh session"
      description: "Rotate refresh token and issue new access token"
      tags: ["auth"]
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Logout"
      description: "Revoke refresh session"
      tags: ["auth"]
    };
  }

  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/auth/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Current user"
      description: "Get current authenticated user info"
      tags: ["auth"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc Healthz(HealthzRequest) returns (HealthzResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Health check"
      tags: ["system"]
    };
  }
}


message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string   access_token = 1;
  UserInfo user         = 2;
}

message RefreshRequest {}

message RefreshResponse {
  string   access_token = 1;
  UserInfo user         = 2;
}

message LogoutRequest {}

message LogoutResponse {
  bool success = 1;
}

message MeRequest {}

message MeResponse {
  string          id          = 1;
  string          email       = 2;
  bool            is_active   = 3;
  repeated string roles       = 4;
  repeated string permissions = 5;
}

message HealthzRequest {}

message HealthzResponse {
  string status = 1;
}

message UserInfo {
  string          id          = 1;
  repeated string roles       = 2;
  repeated string permissions = 3;
}
