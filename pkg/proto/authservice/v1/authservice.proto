syntax = "proto3";

package authservice.v1;

option go_package = "github.com/AlbinaKonovalova/auth-service/pkg/authservice/v1;authservicev1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Auth Service API"
    version: "1.0"
    description: "Authentication and authorization service for admin platform"
  }
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT access token. Format: Bearer {token}"
      }
    }
  }
  consumes: "application/json"
  produces: "application/json"

  tags: {
    name: "AuthService"
  }
  tags: {
    name: "auth"
  }
  tags: {
    name: "users"
  }
  tags: {
    name: "user role assignments"
  }
  tags: {
    name: "roles"
  }
  tags: {
    name: "role permission assignments"
  }
  tags: {
    name: "permissions"
  }
  tags: {
    name: "system"
  }
};

// AuthService provides authentication and authorization operations.
service AuthService {
  // Login authenticates a user and returns an access token.
  // Refresh token is set as httpOnly cookie.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login"
      description: "Authenticate user by email and password"
      tags: ["auth"]
    };
  }

  // Refresh rotates the refresh token and returns a new access token.
  // Reads refresh token from httpOnly cookie, sets new cookie on response.
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Refresh session"
      description: "Rotate refresh token and issue new access token"
      tags: ["auth"]
    };
  }

  // Logout revokes the refresh session.
  // Reads refresh token from httpOnly cookie, clears cookie on response.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Logout"
      description: "Ends the current refresh session if present and clears its cookie. Succeeds even if no session exists"
      tags: ["auth"]
    };
  }

  // Me returns the current authenticated user.
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Current user"
      description: "Get current authenticated user info"
      tags: ["auth"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // Healthz returns service health status.
  rpc Healthz(HealthzRequest) returns (HealthzResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Health check"
      tags: ["system"]
    };
  }

  // CreateUser creates a new user (admin API).
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create user"
      description: "Create a new user with optional initial roles"
      tags: ["users"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ListUsers returns a paginated list of users with optional filters (admin API).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List users"
      description: "Get paginated list of users with optional filters by is_active and role"
      tags: ["users"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // GetUser returns a single user by ID (admin API).
  rpc GetUser(GetUserRequest) returns (AdminUserInfo) {
    option (google.api.http) = {
      get: "/api/v1/admin/users/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get user by ID"
      description: "Get a single user by their UUID"
      tags: ["users"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ActivateUser activates a user account (admin API).
  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/activate"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Activate user"
      description: "Activate a user account by their UUID"
      tags: ["users"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // DeactivateUser deactivates a user account and revokes all their refresh sessions (admin API).
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/deactivate"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Deactivate user"
      description: "Deactivate a user account and revoke all their refresh sessions"
      tags: ["users"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // GetUserRoles returns the list of roles assigned to a user (admin API).
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users/{id}/roles"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get user roles"
      description: "Get the list of roles assigned to a user by their UUID"
      tags: ["user role assignments"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ListRoles returns the full list of roles (admin API).
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/roles"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List roles"
      description: "Get the full list of roles"
      tags: ["roles"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // CreateRole creates a new role (admin API).
  rpc CreateRole(CreateRoleRequest) returns (RoleInfo) {
    option (google.api.http) = {
      post: "/api/v1/admin/roles"
      body: "role"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create role"
      description: "Create a new role. Fails if role code already exists"
      tags: ["roles"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // DeleteRole deletes a role by code (admin API).
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/roles/{role_code}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete role"
      description: "Delete a role by code. Fails if the role is assigned to users or has permissions"
      tags: ["roles"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // AssignRole assigns a role to a user (admin API).
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/roles"
      body: "assignment"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Assign role to user"
      description: "Assign a role to a user by role code. Idempotent: assigning an already assigned role succeeds without error"
      tags: ["user role assignments"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // RevokeRole revokes a role from a user (admin API).
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/users/{id}/roles/{role_code}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Revoke role from user"
      description: "Revoke a role from a user. Fails if the role is not assigned or it is the user's last role"
      tags: ["user role assignments"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ListPermissions returns the full list of permissions (admin API).
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/permissions"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List permissions"
      description: "Get the full list of permissions"
      tags: ["permissions"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // GetRolePermissions returns the list of permissions assigned to a role (admin API).
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/roles/{role_code}/permissions"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get role permissions"
      description: "Get the list of permissions assigned to a role by its code"
      tags: ["role permission assignments"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // AssignPermission assigns a permission to a role (admin API).
  rpc AssignPermission(AssignPermissionRequest) returns (AssignPermissionResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/roles/{role_code}/permissions"
      body: "assignment"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Assign permission to role"
      description: "Assign a permission to a role by permission code. Idempotent: assigning an already assigned permission succeeds without error"
      tags: ["role permission assignments"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // CreatePermission creates a new permission (admin API).
  rpc CreatePermission(CreatePermissionRequest) returns (PermissionInfo) {
    option (google.api.http) = {
      post: "/api/v1/admin/permissions"
      body: "permission"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create permission"
      description: "Create a new permission. Fails if permission code already exists or description is empty"
      tags: ["permissions"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // RevokePermission revokes a permission from a role (admin API).
  rpc RevokePermission(RevokePermissionRequest) returns (RevokePermissionResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/roles/{role_code}/permissions/{permission_code}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Revoke permission from role"
      description: "Revoke a permission from a role. Fails if the permission is not assigned to the role"
      tags: ["role permission assignments"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }
}

// Login

message LoginRequest {
  string email = 1 [json_name = "email"];
  string password = 2 [json_name = "password"];
}

message LoginResponse {
  string access_token = 1 [json_name = "access_token"];
  UserInfo user = 2 [json_name = "user"];
}

// Refresh

message RefreshRequest {}

message RefreshResponse {
  string access_token = 1 [json_name = "access_token"];
  UserInfo user = 2 [json_name = "user"];
}

// Logout

message LogoutRequest {}

message LogoutResponse {
  bool success = 1 [json_name = "success"];
}

// Me

message MeRequest {}

message MeResponse {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  bool is_active = 3 [json_name = "is_active"];
  repeated string roles = 4 [json_name = "roles"];
  repeated string permissions = 5 [json_name = "permissions"];
}

// Healthz

message HealthzRequest {}

message HealthzResponse {
  string status = 1 [json_name = "status"];
}

// Shared messages

message UserInfo {
  string id = 1 [json_name = "id"];
  repeated string roles = 2 [json_name = "roles"];
  repeated string permissions = 3 [json_name = "permissions"];
}

// Admin — Users

message CreateUserRequest {
  string email = 1 [json_name = "email"];
  string password = 2 [json_name = "password"];
  repeated string roles = 3 [json_name = "roles"];
}

message CreateUserResponse {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  bool is_active = 3 [json_name = "is_active"];
  repeated string roles = 4 [json_name = "roles"];
}

// Admin — List Users

message ListUsersRequest {
  optional bool is_active = 1 [json_name = "is_active"];
  string role = 2 [json_name = "role"];
  int32 page = 3 [json_name = "page"];
  int32 per_page = 4 [json_name = "per_page"];
}

message ListUsersResponse {
  repeated AdminUserInfo users = 1 [json_name = "users"];
  int32 total = 2 [json_name = "total"];
  int32 page = 3 [json_name = "page"];
  int32 per_page = 4 [json_name = "per_page"];
}

message AdminUserInfo {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  bool is_active = 3 [json_name = "is_active"];
  repeated string roles = 4 [json_name = "roles"];
}

// Admin — Get User by ID

message GetUserRequest {
  string id = 1 [json_name = "id"];
}

// Admin — Activate User

message ActivateUserRequest {
  string id = 1 [json_name = "id"];
}

message ActivateUserResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — Deactivate User

message DeactivateUserRequest {
  string id = 1 [json_name = "id"];
}

message DeactivateUserResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — Get User Roles

message RoleInfo {
  string id = 1 [json_name = "id"];
  string code = 2 [json_name = "code"];
  string name = 3 [json_name = "name"];
  string description = 4 [json_name = "description"];
}

message GetUserRolesRequest {
  string id = 1 [json_name = "id"];
}

message GetUserRolesResponse {
  repeated RoleInfo roles = 1 [json_name = "roles"];
}

// Admin — List Roles

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleInfo roles = 1 [json_name = "roles"];
}

// Admin — Assign Role

message AssignRoleBody {
  string role_code = 1 [json_name = "role_code"];
}

message AssignRoleRequest {
  string id = 1 [json_name = "id"];
  AssignRoleBody assignment = 2 [json_name = "assignment"];
}

message AssignRoleResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — Revoke Role

message RevokeRoleRequest {
  string id = 1 [json_name = "id"];
  string role_code = 2 [json_name = "role_code"];
}

message RevokeRoleResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — List Permissions

message PermissionInfo {
  string id = 1 [json_name = "id"];
  string code = 2 [json_name = "code"];
  string description = 3 [json_name = "description"];
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated PermissionInfo permissions = 1 [json_name = "permissions"];
}

// Admin — Get Role Permissions

message GetRolePermissionsRequest {
  string role_code = 1 [json_name = "role_code"];
}

message GetRolePermissionsResponse {
  repeated PermissionInfo permissions = 1 [json_name = "permissions"];
}

// Admin — Assign Permission to Role

message AssignPermissionBody {
  string permission_code = 1 [json_name = "permission_code"];
}

message AssignPermissionRequest {
  string role_code = 1 [json_name = "role_code"];
  AssignPermissionBody assignment = 2 [json_name = "assignment"];
}

message AssignPermissionResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — Revoke Permission from Role

message RevokePermissionRequest {
  string role_code = 1 [json_name = "role_code"];
  string permission_code = 2 [json_name = "permission_code"];
}

message RevokePermissionResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — Create Permission

message CreatePermissionBody {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["code", "description"]
    }
  };

  string code = 1 [json_name = "code"];
  string description = 2 [json_name = "description"];
}

message CreatePermissionRequest {
  CreatePermissionBody permission = 1 [json_name = "permission"];
}

// Admin — Create Role

message CreateRoleBody {
  string code = 1 [json_name = "code"];
  string name = 2 [json_name = "name"];
  string description = 3 [json_name = "description"];
}

message CreateRoleRequest {
  CreateRoleBody role = 1 [json_name = "role"];
}

// Admin — Delete Role

message DeleteRoleRequest {
  string role_code = 1 [json_name = "role_code"];
}

message DeleteRoleResponse {
  bool success = 1 [json_name = "success"];
}