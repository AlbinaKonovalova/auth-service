syntax = "proto3";

package authservice.v1;

option go_package = "github.com/AlbinaKonovalova/auth-service/pkg/authservice/v1;authservicev1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Auth Service API"
    version: "1.0"
    description: "Authentication and authorization service for admin platform"
  }
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT access token. Format: Bearer {token}"
      }
    }
  }
  consumes: "application/json"
  produces: "application/json"
};

// AuthService provides authentication and authorization operations.
service AuthService {
  // Login authenticates a user and returns an access token.
  // Refresh token is set as httpOnly cookie.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Login"
      description: "Authenticate user by email and password"
      tags: ["auth"]
    };
  }

  // Refresh rotates the refresh token and returns a new access token.
  // Reads refresh token from httpOnly cookie, sets new cookie on response.
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Refresh session"
      description: "Rotate refresh token and issue new access token"
      tags: ["auth"]
    };
  }

  // Logout revokes the refresh session.
  // Reads refresh token from httpOnly cookie, clears cookie on response.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Logout"
      description: "Ends the current refresh session if present and clears its cookie. Succeeds even if no session exists"
      tags: ["auth"]
    };
  }

  // Me returns the current authenticated user.
  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/me"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Current user"
      description: "Get current authenticated user info"
      tags: ["auth"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // Healthz returns service health status.
  rpc Healthz(HealthzRequest) returns (HealthzResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Health check"
      tags: ["system"]
    };
  }

  // CreateUser creates a new user (admin API).
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create user"
      description: "Create a new user with optional initial roles"
      tags: ["admin"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ListUsers returns a paginated list of users with optional filters (admin API).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List users"
      description: "Get paginated list of users with optional filters by is_active and role"
      tags: ["admin"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // GetUser returns a single user by ID (admin API).
  rpc GetUser(GetUserRequest) returns (AdminUserInfo) {
    option (google.api.http) = {
      get: "/api/v1/admin/users/{id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get user by ID"
      description: "Get a single user by their UUID"
      tags: ["admin"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ActivateUser activates a user account (admin API).
  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/activate"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Activate user"
      description: "Activate a user account by their UUID"
      tags: ["admin"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // DeactivateUser deactivates a user account and revokes all their refresh sessions (admin API).
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{id}/deactivate"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Deactivate user"
      description: "Deactivate a user account and revoke all their refresh sessions"
      tags: ["admin"]
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }
}

// Login

message LoginRequest {
  string email = 1 [json_name = "email"];
  string password = 2 [json_name = "password"];
}

message LoginResponse {
  string access_token = 1 [json_name = "access_token"];
  UserInfo user = 2 [json_name = "user"];
}

// Refresh

message RefreshRequest {}

message RefreshResponse {
  string access_token = 1 [json_name = "access_token"];
  UserInfo user = 2 [json_name = "user"];
}

// Logout

message LogoutRequest {}

message LogoutResponse {
  bool success = 1 [json_name = "success"];
}

// Me

message MeRequest {}

message MeResponse {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  bool is_active = 3 [json_name = "is_active"];
  repeated string roles = 4 [json_name = "roles"];
  repeated string permissions = 5 [json_name = "permissions"];
}

// Healthz

message HealthzRequest {}

message HealthzResponse {
  string status = 1 [json_name = "status"];
}

// Shared messages

message UserInfo {
  string id = 1 [json_name = "id"];
  repeated string roles = 2 [json_name = "roles"];
  repeated string permissions = 3 [json_name = "permissions"];
}

// Admin — Users

message CreateUserRequest {
  string email = 1 [json_name = "email"];
  string password = 2 [json_name = "password"];
  repeated string roles = 3 [json_name = "roles"];
}

message CreateUserResponse {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  bool is_active = 3 [json_name = "is_active"];
  repeated string roles = 4 [json_name = "roles"];
}

// Admin — List Users

message ListUsersRequest {
  optional bool is_active = 1 [json_name = "is_active"];
  string role = 2 [json_name = "role"];
  int32 page = 3 [json_name = "page"];
  int32 per_page = 4 [json_name = "per_page"];
}

message ListUsersResponse {
  repeated AdminUserInfo users = 1 [json_name = "users"];
  int32 total = 2 [json_name = "total"];
  int32 page = 3 [json_name = "page"];
  int32 per_page = 4 [json_name = "per_page"];
}

message AdminUserInfo {
  string id = 1 [json_name = "id"];
  string email = 2 [json_name = "email"];
  bool is_active = 3 [json_name = "is_active"];
  repeated string roles = 4 [json_name = "roles"];
}

// Admin — Get User by ID

message GetUserRequest {
  string id = 1 [json_name = "id"];
}

// Admin — Activate User

message ActivateUserRequest {
  string id = 1 [json_name = "id"];
}

message ActivateUserResponse {
  bool success = 1 [json_name = "success"];
}

// Admin — Deactivate User

message DeactivateUserRequest {
  string id = 1 [json_name = "id"];
}

message DeactivateUserResponse {
  bool success = 1 [json_name = "success"];
}