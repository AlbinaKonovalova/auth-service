server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 5s

database:
  url: postgres://postgres:postgres@localhost:5432/auth_db?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

log:
  level: info
  format: json

auth:
  jwt_secret: "change-me-in-production"
  access_token_ttl: 15m
  refresh_token_bytes: 32

cookie:
  name: refresh_token
  path: /auth
  domain: ""
  secure: false
  same_site: lax
  ttl: 168h

argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  salt_length: 16
  key_length: 32

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"