# ============================================================
# HTTP сервер
# ============================================================
server:
  # Порт на котором поднимается HTTP сервер
  port: 8080
  # Таймаут чтения входящего запроса
  read_timeout: 10s
  # Таймаут записи ответа
  write_timeout: 10s
  # Таймаут graceful shutdown при получении SIGINT/SIGTERM
  shutdown_timeout: 5s

# ============================================================
# PostgreSQL
# ============================================================
database:
  # DSN подключения к PostgreSQL
  url: postgres://postgres:postgres@localhost:5432/auth_db?sslmode=disable
  # Максимальное кол-во открытых соединений в пуле
  max_open_conns: 25
  # Максимальное кол-во простаивающих соединений в пуле
  max_idle_conns: 5
  # Максимальное время жизни соединения
  conn_max_lifetime: 5m

# ============================================================
# Логирование
# ============================================================
log:
  # Уровень логирования: debug | info | warn | error
  level: info
  # Формат логов: json | text
  format: json

# ============================================================
# JWT и токены
# ============================================================
auth:
  # Секрет подписи access JWT — обязательно задать через env в prod
  jwt_secret: "change-me-in-production"
  # TTL access token
  access_token_ttl: 15m
  # Кол-во байт для генерации raw refresh/reset токена
  refresh_token_bytes: 32

# ============================================================
# Refresh token cookie
# ============================================================
cookie:
  # Имя httpOnly cookie с refresh token
  name: refresh_token
  # Path — cookie отправляется только на эти маршруты
  path: /auth
  # Domain — пустая строка = текущий хост
  domain: ""
  # Secure: true — cookie только через HTTPS (false только для local dev)
  secure: false
  # SameSite политика: strict | lax | none
  same_site: lax
  # Время жизни refresh cookie
  ttl: 168h

# ============================================================
# Argon2id — параметры хеширования паролей
# ============================================================
argon2:
  # Объём памяти в KiB (64MB)
  memory: 65536
  # Кол-во итераций
  iterations: 3
  # Степень параллелизма
  parallelism: 2
  # Длина соли в байтах
  salt_length: 16
  # Длина результирующего ключа в байтах
  key_length: 32

# ============================================================
# CORS — список разрешённых origin'ов
# Пустой список = CORS заголовки не выставляются
# ============================================================
cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"