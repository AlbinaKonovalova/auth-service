server:
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 5s

database:
  url: postgres://postgres:postgres@localhost:5432/auth_db?sslmode=disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

log:
  level: info
  format: json

auth:
  jwt_secret: "change-me-in-production"
  access_token_ttl: 15m
  refresh_token_bytes: 32

cookie:
  name: refresh_token
  path: api/v1/auth
  domain: ""
  secure: false
  same_site: lax
  ttl: 168h

argon2:
  memory: 65536
  iterations: 3
  parallelism: 2
  salt_length: 16
  key_length: 32

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

smtp:
  host: "127.0.0.1"
  port: 1025
  auth_enabled: true
  username: "harrys_uz@protonmail.com"
  password: "ID14p721OKR7gelhwdQCZA"
  from: "harrys_uz@protonmail.com"
  fallback_timeout_seconds: 15
  skip_tls_verify: true

password_reset:
  ttl: 30m
  base_url: "http://localhost:3000/reset-password"